[package]
name = "paritysql"
version = "0.1.1"
description = "ParitySQL - Extrae y compara objetos SQL Server"
authors = ["ParitySQL"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "paritysql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { version = "0.12", features = ["sql-browser-tokio"] }
rfd = "0.15"
tauri-plugin-updater = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
